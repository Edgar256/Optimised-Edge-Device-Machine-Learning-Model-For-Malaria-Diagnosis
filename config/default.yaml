project:
  name: malaria-edge-ml
  title: "Optimising Edge-Device Machine Learning Models for Malaria Diagnosis in Rural Health Centers in Hoima District, Uganda"
  random_seed: 42

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  models_dir: models
  results_dir: results
  figures_dir: figures
  reports_dir: reports

data:
  raw_filename: PATIENT_RECORD_DATA_EXTRACTION_FORM.csv
  csv_separator: ";"
  encoding: utf-8

  target_column: "Final Confirmed Diagnosis (Malaria / Not Malaria)"
  target_positive_label: Malaria
  target_negative_label: "Not malaria"

  identifier_columns:
    - "Patient ID (Anonymous Code)"
    - _uuid

  metadata_columns:
    - start
    - end
    - _id
    - _submission_time
    - _validation_status
    - _notes
    - _status
    - _submitted_by
    - __version__
    - _tags
    - meta/rootUuid
    - _index

  # Columns recorded after or during diagnostic workup; exclude from triage-time features.
  post_diagnosis_columns:
    - "Rapid Diagnostic Test (RDT) Result (Positive/Negative)"
    - "Microscopy Result (Positive/Negative)"
    - "Parasite Density (if available)"
    - "Treatment Given"
    - "Additional Clinical Notes"

  clinical_feature_columns:
    - "Health Facility Name"
    - "Date of Visit"
    - Age
    - "Gender (Male/Female)"
    - "Geographical Zone"
    - "Fever (Yes/No)"
    - "Headache (Yes/No)"
    - "Chills (Yes/No)"
    - "Vomiting (Yes/No)"
    - "Fatigue (Yes/No)"
    - "Other Symptoms (Specify)"
    - "Fever Duration (Days)"
    - "Anemia Signs (Yes/No)"
    - "Season of Visit (Dry/Rainy)"
    - "Recent Travel (Yes/No)"
    - "Exposure Risk (e.g., mosquito-prone area) (Yes/No)"
    - "Household Malaria History (Yes/No)"

preprocessing:
  processed_dataset_filename: processed_dataset.csv
  pipeline_filename: preprocessing_pipeline.joblib
  scale_numeric: false
  test_patient_ids:
    - Test123

feature_engineering:
  input_filename: processed_dataset.csv
  output_filename: engineered_dataset.csv
  age_child_max: 17
  age_senior_min: 60
  pediatric_high_risk_max: 4
  fever_acute_max_days: 2
  fever_prolonged_min_days: 3
  all_symptoms:
    - "Fever (Yes/No)"
    - "Headache (Yes/No)"
    - "Chills (Yes/No)"
    - "Vomiting (Yes/No)"
    - "Fatigue (Yes/No)"
  core_symptoms:
    - "Fever (Yes/No)"
    - "Headache (Yes/No)"
    - "Vomiting (Yes/No)"

training:
  cv_folds: 5
  comparison_filename: baseline_comparison.csv
  ranking_filename: baseline_ranking.csv
  manifest_filename: baseline_training_manifest.json

hyperparameter_optimization:
  top_n: 3
  n_iter: 30
  ranking_source: baseline_ranking.csv
  baseline_comparison_source: baseline_comparison.csv
  before_filename: hyperparameter_before_optimization.csv
  after_filename: hyperparameter_after_optimization.csv
  comparison_filename: hyperparameter_comparison.csv

explainability:
  output_dir: reports/explainability
  # Matches the deployed edge model (same as api / baseline rank-1).
  model_name: logistic_regression

api:
  host: 0.0.0.0
  port: 8000
  # Pinned to the baseline rank-1 edge model. Leave unset to auto-select from baseline_ranking.csv.
  model_name: logistic_regression
  cors_origins:
    - "*"
  defaults:
    health_facility_name: kasomoro_health_centre
    geographical_zone: mbaraara
    season: Rainy
  risk_thresholds:
    high_confidence: 0.75
    medium_confidence: 0.5
    fever_temperature_celsius: 38.0

chapter4:
  output_dir: reports/chapter4

tflite:
  output_dir: models/tflite
  # Optional pin; default = auto-select baseline rank-1 (must be logistic_regression for TFLite).
  # model_name: logistic_regression
  min_app_version: "1.0.0"
