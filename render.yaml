services:
  - type: web
    name: malaria-edge-ml
    runtime: python
    plan: free
    branch: dev
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_REGISTRATION_SECRET
        sync: false
